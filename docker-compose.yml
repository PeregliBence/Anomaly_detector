version: '3.8'

services:
  # UI Dashboard
  dashboard:
    build: .
    container_name: anomaly_detector_ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0

# Használat:
# docker-compose up -d --build  (háttérben indítás)
# docker-compose logs -f dashboard (logok figyelése)
# docker-compose down (leállítás)